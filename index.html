<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Component</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <main class="qr-stage">
      <!-- 독립적으로 구분될 수 있는 하나의 완성된 콘텐츠(카드) -->
      <article class="qr-card">
        <!-- QR 코드 이미지: alt 속성으로 이미지의 목적이나 목적지를 명확히 설명 -->
        <img src="./images/image-qr-code.png" alt="Frontend Mentor 웹사이트로 이동하는 QR 코드" class="qr-card__image">
        <!-- 텍스트 그룹화 (단순 레이아웃/스타일링 목적이라면 이 위치의 div는 적절함) -->
        <div class="qr-card__content">
          <!-- 카드의 핵심 제목 -->
          <h1 class="qr-card__title">
            Improve your front-end skills by building projects
          </h1>
          <!-- 부연 설명 텍스트 -->
          <p class="qr-card__description">
            Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
          </p>
        </div>
      </article>
    </main>
  </div>
</body>

</html>
